<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="16" height="16" rx="2" fill="#e56045"/>
  
  <!-- 简化的机器人图标 -->
  <!-- 机器人头部 -->
  <rect x="3" y="4" width="10" height="8" rx="1" fill="white"/>
  
  <!-- 机器人眼睛 -->
  <circle cx="6" cy="7" r="1" fill="#e56045"/>
  <circle cx="10" cy="7" r="1" fill="#e56045"/>
  
  <!-- 机器人嘴巴 -->
  <rect x="6.5" y="9.5" width="3" height="0.5" rx="0.25" fill="#e56045"/>
  
  <!-- 机器人天线 -->
  <rect x="7.5" y="2" width="1" height="2" fill="white"/>
  <circle cx="8" cy="1.5" r="0.5" fill="white"/>
  
  <!-- 机器人身体指示 -->
  <rect x="5" y="12" width="6" height="2" rx="0.5" fill="white"/>
  <circle cx="6.5" cy="13" r="0.3" fill="#e56045"/>
  <circle cx="9.5" cy="13" r="0.3" fill="#e56045"/>
</svg> 