<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e56045;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc553d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect width="180" height="180" rx="20" fill="url(#bg)"/>
  
  <!-- 机器人主体 -->
  <g transform="translate(90,90)">
    <!-- 机器人头部 -->
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="white" filter="url(#shadow)"/>
    
    <!-- 机器人眼睛 -->
    <circle cx="-18" cy="-10" r="8" fill="#e56045"/>
    <circle cx="18" cy="-10" r="8" fill="#e56045"/>
    
    <!-- 眼睛高光 -->
    <circle cx="-15" cy="-13" r="3" fill="white" opacity="0.8"/>
    <circle cx="21" cy="-13" r="3" fill="white" opacity="0.8"/>
    
    <!-- 机器人嘴巴 -->
    <rect x="-15" y="5" width="30" height="4" rx="2" fill="#e56045"/>
    
    <!-- 机器人天线 -->
    <line x1="0" y1="-45" x2="0" y2="-25" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-50" r="5" fill="white"/>
    <circle cx="0" cy="-50" r="3" fill="#e56045"/>
    
    <!-- 机器人身体 -->
    <rect x="-25" y="25" width="50" height="30" rx="5" fill="white" filter="url(#shadow)"/>
    
    <!-- 身体装饰 -->
    <circle cx="-12" cy="35" r="3" fill="#e56045"/>
    <circle cx="0" cy="35" r="3" fill="#e56045"/>
    <circle cx="12" cy="35" r="3" fill="#e56045"/>
    
    <!-- 机器人胳膊 -->
    <rect x="-40" y="30" width="10" height="20" rx="5" fill="white"/>
    <rect x="30" y="30" width="10" height="20" rx="5" fill="white"/>
    
    <!-- 胳膊装饰 -->
    <circle cx="-35" cy="35" r="2" fill="#e56045"/>
    <circle cx="35" cy="35" r="2" fill="#e56045"/>
  </g>
</svg> 